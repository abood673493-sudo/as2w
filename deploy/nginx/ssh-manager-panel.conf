# SSH Manager Panel - Nginx reverse proxy (alternative to Caddy)
#
# Install to /etc/nginx/sites-available/ssh-manager-panel and enable with:
#   ln -s /etc/nginx/sites-available/ssh-manager-panel /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Replace panel.example.com / ws.example.com with your hostnames. Certificates
# are issued by certbot (see docs/ubuntu-install.md).

# Required for WebSocket upgrades.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sshmp_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream sshmp_ws {
    server 127.0.0.1:8081;
    keepalive 16;
}

# ACME HTTP-01 challenge + redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com ws.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Dashboard and REST API.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://sshmp_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://sshmp_api;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://sshmp_api;
        access_log off;
    }

    # Built SPA (npm run build -> frontend/dist).
    root /var/www/ssh-manager-panel;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# SSH over WebSocket / secure WebSocket gateway.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ws.example.com;

    ssl_certificate     /etc/letsencrypt/live/ws.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;

    # Long-lived tunnels: disable buffering/timeouts that would cut the stream.
    location /ssh {
        proxy_pass http://sshmp_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering     off;
        proxy_request_buffering off;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        tcp_nodelay on;
    }

    location / {
        return 404;
    }
}